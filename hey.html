<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="AdultBite – Premium Wellness Products. Discover our signature collection of luxury intimacy wellness essentials.">
    <title>AdultBite | Our Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #FFFFFF;
            color: #1A1A1A;
        }

        /* Header */
        .products-header {
            background: linear-gradient(135deg, #4B0118 0%, #701c34 100%);
            padding: 30px 5% 40px;
            text-align: center;
            border-bottom: 3px solid #D4AF37;
        }

        .products-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: white;
            margin-bottom: 10px;
        }

        .products-header p {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.15);
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 50px;
            margin-top: 20px;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .back-home:hover {
            background: #D4AF37;
            color: #4B0118;
        }

        /* Filter Bar */
        .filter-bar {
            padding: 18px 5%;
            background: #F9F7F5;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #ddd;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #4B0118;
        }

        .filter-btn.active {
            background: #D4AF37;
            border-color: #D4AF37;
            color: #4B0118;
        }

        .filter-btn:hover:not(.active) {
            background: #e0d6cc;
        }

        .results-count {
            font-size: 0.75rem;
            color: #666;
        }

        /* Products Grid */
        .products-container {
            padding: 40px 5%;
            min-height: 60vh;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #f0ebe4;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #faf7f2;
            padding: 20px;
        }

        .product-info {
            padding: 18px 16px 22px;
            text-align: center;
        }

        .product-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: #4B0118;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        /* Variation Selector inside product card */
        .variation-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .var-btn {
            background: #f5f0ea;
            border: 1px solid #e0d6cc;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #4B0118;
        }

        .var-btn.active {
            background: #D4AF37;
            border-color: #D4AF37;
        }

        .var-btn:hover:not(.active) {
            background: #e6dbd0;
        }

        .view-details {
            display: inline-block;
            background: #D4AF37;
            color: #4B0118;
            text-decoration: none;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.75rem;
            transition: 0.2s;
            margin-top: 8px;
            border: none;
            cursor: pointer;
        }

        .view-details:hover {
            background: #4B0118;
            color: #D4AF37;
            transform: translateY(-2px);
        }

        .coming-soon {
            background: #f0ebe4;
            color: #7a6a5c;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.75rem;
            display: inline-block;
            margin-top: 8px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #D4AF37;
        }

        /* Footer */
        .products-footer {
            background: #4B0118;
            color: white;
            text-align: center;
            padding: 30px 5%;
            border-top: 3px solid #D4AF37;
            margin-top: 20px;
        }

        .products-footer p {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .products-header h1 {
                font-size: 1.6rem;
            }
            
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .product-info {
                padding: 12px 10px 16px;
            }
            
            .product-name {
                font-size: 0.9rem;
            }
            
            .var-btn {
                padding: 3px 8px;
                font-size: 0.6rem;
            }
            
            .view-details, .coming-soon {
                padding: 6px 16px;
                font-size: 0.65rem;
            }
            
            .filter-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .filter-buttons {
                width: 100%;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 5px;
            }

            .product-desc {
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                gap: 12px;
            }
            
            .product-image {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<header class="products-header">
    <h1>Our Signature Collection</h1>
    <p>Luxury wellness essentials crafted for confidence & intimacy</p>
    <a href="#" class="back-home" id="backHomeBtn">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>
</header>

<div class="filter-bar">
    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All Products</button>
        <button class="filter-btn" data-filter="chocolate">Chocolate</button>
        <button class="filter-btn" data-filter="spray">Oral Spray</button>
        <button class="filter-btn" data-filter="cards">Playing Cards</button>
        <button class="filter-btn" data-filter="delay">Delay Spray</button>
        <button class="filter-btn" data-filter="condoms">Condoms</button>
        <button class="filter-btn" data-filter="lube">Lubricant</button>
    </div>
    <div class="results-count" id="resultsCount">Showing all products</div>
</div>

<div class="products-container">
    <div class="product-grid" id="productGrid"></div>
</div>

<footer class="products-footer">
    <p>© 2026 AdultBite Luxury Wellness. All rights reserved.</p>
    <p style="margin-top: 8px;">Adults only • 21+</p>
</footer>

<script>
    // Products Data with variations - NO PRICES DISPLAYED
    const productsData = [
        { 
            id: 1,
            name: "Intimacy Chocolate", 
            img: "chocolate3.png", 
            category: "chocolate", 
            comingSoon: false,
            hasVariations: true,
            description: "Premium cacao blend for mood enhancement",
            variations: [
                { type: "Single", link: "singlechocolate.html", suffix: "", image: "chocolate3.png" },
                { type: "Combo", link: "combochocolate.html", suffix: " (Save ₹50)", image: "chocolate_combo.png" }
            ]
        },
        { 
            id: 2,
            name: "Oral Spray", 
            img: "spray.png", 
            category: "spray", 
            comingSoon: false,
            hasVariations: true,
            description: "Freshness & confidence in every spray",
            variations: [
                { type: "Mango", link: "oral_spray_mango.html", suffix: " - Mango Bliss", image: "spray_mango.png" },
                { type: "Bubble Gum", link: "oral_spray_bubblegum.html", suffix: " - Bubble Gum", image: "spray_bubblegum.png" }
            ]
        },
        { 
            id: 3,
            name: "Playing Cards", 
            img: "main_cards.jpeg", 
            link: "cards.html", 
            category: "cards", 
            comingSoon: false, 
            hasVariations: false,
            description: "Adult party game cards for couple fun"
        },
        { 
            id: 4,
            name: "Delay Spray", 
            img: "mian_delay.png", 
            link: "#", 
            category: "delay", 
            comingSoon: true, 
            hasVariations: false,
            description: "Long-lasting performance spray"
        },
        { 
            id: 5,
            name: "Premium Condoms", 
            img: "main_condoms.png", 
            link: "#", 
            category: "condoms", 
            comingSoon: true, 
            hasVariations: false,
            description: "Ultra-thin & comfortable protection"
        },
        { 
            id: 6,
            name: "Lubricant", 
            img: "mian_lube.jpeg", 
            link: "#", 
            category: "lube", 
            comingSoon: true, 
            hasVariations: false,
            description: "Smooth & natural intimate glide"
        }
    ];

    // State for selected variations
    let selectedVariations = {};

    // Current filter
    let currentFilter = "all";

    // Helper to render products based on filter - NO PRICES
    function renderProducts() {
        const grid = document.getElementById('productGrid');
        if (!grid) return;

        let filteredProducts = productsData;
        if (currentFilter !== "all") {
            filteredProducts = productsData.filter(p => p.category === currentFilter);
        }

        const count = filteredProducts.length;
        const countText = count === 0 ? "No products found" : `${count} product${count !== 1 ? 's' : ''}`;
        document.getElementById('resultsCount').innerText = `Showing ${countText}`;

        if (filteredProducts.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <p>No products in this category.</p>
                    <p style="font-size: 0.8rem; margin-top: 8px;">Try another filter!</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = filteredProducts.map((p) => {
            if (p.comingSoon) {
                return `
                    <div class="product-card" data-product-id="${p.id}">
                        <img src="${p.img}" class="product-image" alt="${p.name}" onerror="this.src='https://placehold.co/300x300/f5f0ea/4b0118?text=${p.name}'">
                        <div class="product-info">
                            <h3 class="product-name">${p.name}</h3>
                            <div class="product-desc">${p.description}</div>
                            <span class="coming-soon">Coming Soon</span>
                        </div>
                    </div>
                `;
            } 
            else if (p.hasVariations) {
                // Initialize selected variation if not set
                if (!selectedVariations[p.id]) {
                    selectedVariations[p.id] = p.variations[0];
                }
                const currentVar = selectedVariations[p.id];
                const displayName = p.name + (currentVar.suffix || "");
                const linkUrl = currentVar.link;
                const currentImage = currentVar.image || p.img;

                const varButtons = p.variations.map((v, vIdx) => {
                    const isActive = selectedVariations[p.id] === v;
                    return `<button class="var-btn ${isActive ? 'active' : ''}" data-product-id="${p.id}" data-var-index="${vIdx}">${v.type}</button>`;
                }).join('');

                return `
                    <div class="product-card" data-product-id="${p.id}">
                        <img src="${currentImage}" class="product-image" alt="${displayName}" onerror="this.src='https://placehold.co/300x300/f5f0ea/4b0118?text=${p.name}'">
                        <div class="product-info">
                            <h3 class="product-name">${displayName}</h3>
                            <div class="variation-selector">${varButtons}</div>
                            <div class="product-desc">${p.description}</div>
                            <a href="${linkUrl}" class="view-details">View Details</a>
                        </div>
                    </div>
                `;
            } 
            else {
                return `
                    <div class="product-card" data-product-id="${p.id}">
                        <img src="${p.img}" class="product-image" alt="${p.name}" onerror="this.src='https://placehold.co/300x300/f5f0ea/4b0118?text=${p.name}'">
                        <div class="product-info">
                            <h3 class="product-name">${p.name}</h3>
                            <div class="product-desc">${p.description}</div>
                            <a href="${p.link}" class="view-details">View Details</a>
                        </div>
                    </div>
                `;
            }
        }).join('');

        // Attach event listeners for variation buttons AFTER rendering
        document.querySelectorAll('.var-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const productId = parseInt(btn.dataset.productId);
                const varIndex = parseInt(btn.dataset.varIndex);
                const product = productsData.find(p => p.id === productId);
                
                if (product && product.hasVariations && product.variations[varIndex]) {
                    const newVariation = product.variations[varIndex];
                    selectedVariations[productId] = newVariation;
                    
                    // Update the specific product card
                    const card = btn.closest('.product-card');
                    const img = card.querySelector('.product-image');
                    const nameEl = card.querySelector('.product-name');
                    const link = card.querySelector('.view-details');
                    
                    if (img && newVariation.image) img.src = newVariation.image;
                    if (nameEl) nameEl.textContent = product.name + (newVariation.suffix || "");
                    if (link) link.href = newVariation.link;
                    
                    // Update active state on variation buttons
                    card.querySelectorAll('.var-btn').forEach((b, i) => {
                        if (i === varIndex) b.classList.add('active');
                        else b.classList.remove('active');
                    });
                }
            });
        });
    }

    // Initial render
    renderProducts();

    // Filter functionality
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // Update active class
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Update filter and re-render
            currentFilter = btn.dataset.filter;
            renderProducts();
            
            // Smooth scroll to top of products
            document.querySelector('.products-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });

    // Back to Home button
    const backHomeBtn = document.getElementById('backHomeBtn');
    if (backHomeBtn) {
        backHomeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = "/";
        });
    }
</script>
</body>
</html>
